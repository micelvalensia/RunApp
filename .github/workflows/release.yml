name: Build Electron Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build:win

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/*.exe" `
            -DestinationPath "dist/RunnerApp-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RunnerApp-${{ github.ref_name }}.zip